<text x="24" y="130" fill="#e7f6ff" font-size="14">if (Valid input?) then (no)</text>
<text x="24" y="152" fill="#e7f6ff" font-size="14">:400 error;</text>
<text x="24" y="174" fill="#e7f6ff" font-size="14">stop</text>
<text x="24" y="196" fill="#e7f6ff" font-size="14">endif</text>
<text x="24" y="218" fill="#e7f6ff" font-size="14">if (R2 HIT?) then (yes)</text>
<text x="24" y="240" fill="#e7f6ff" font-size="14">:Return cached result;</text>
<text x="24" y="262" fill="#e7f6ff" font-size="14">stop</text>
<text x="24" y="284" fill="#e7f6ff" font-size="14">endif</text>
<text x="24" y="306" fill="#e7f6ff" font-size="14">:Fetch NASA GIBS SST and chlorophyll;</text>
<text x="24" y="328" fill="#e7f6ff" font-size="14">:Sample bbox grid and quality-filter;</text>
<text x="24" y="350" fill="#e7f6ff" font-size="14">if (Usable cells?) then (no)</text>
<text x="24" y="372" fill="#e7f6ff" font-size="14">:422 no observations;</text>
<text x="24" y="394" fill="#e7f6ff" font-size="14">stop</text>
<text x="24" y="416" fill="#e7f6ff" font-size="14">endif</text>
<text x="24" y="438" fill="#e7f6ff" font-size="14">:Deterministic score;</text>
