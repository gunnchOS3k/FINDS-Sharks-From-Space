  <text x="24" y="64" fill="#e7f6ff" font-size="14">title Conceptual shark tag model &lt;&lt;conceptual&gt;&gt;</text>
<text x="24" y="86" fill="#e7f6ff" font-size="14">note top</text>
<text x="24" y="108" fill="#e7f6ff" font-size="14">CONCEPTUAL DESIGN — NOT PHYSICALLY DEPLOYED</text>
<text x="24" y="130" fill="#e7f6ff" font-size="14">Synthetic fixtures only; not wired to production NASA scoring</text>
<text x="24" y="152" fill="#e7f6ff" font-size="14">end note</text>
<text x="24" y="174" fill="#e7f6ff" font-size="14">class SharkIdentity &lt;&lt;conceptual&gt;&gt; {</text>
<text x="24" y="196" fill="#e7f6ff" font-size="14">id</text>
<text x="24" y="218" fill="#e7f6ff" font-size="14">speciesLabel</text>
<text x="24" y="240" fill="#e7f6ff" font-size="14">}</text>
<text x="24" y="262" fill="#e7f6ff" font-size="14">class TagIdentity &lt;&lt;conceptual&gt;&gt; {</text>
<text x="24" y="284" fill="#e7f6ff" font-size="14">tagId</text>
<text x="24" y="306" fill="#e7f6ff" font-size="14">firmwareVersion</text>
<text x="24" y="328" fill="#e7f6ff" font-size="14">sharkId</text>
<text x="24" y="350" fill="#e7f6ff" font-size="14">}</text>
<text x="24" y="372" fill="#e7f6ff" font-size="14">class TagObservation &lt;&lt;conceptual&gt;&gt; {</text>
<text x="24" y="394" fill="#e7f6ff" font-size="14">lat</text>
<text x="24" y="416" fill="#e7f6ff" font-size="14">lon</text>
<text x="24" y="438" fill="#e7f6ff" font-size="14">depthM</text>
